# 默认设置。要改的话，在你自己的配置目录里放一份同名文件即可整体覆盖：
#
#     ~/.local/share/bill/settings.toml
#
# 改完刷新页面就生效，不用重启——应用每次请求都会重新读这个文件。

# 所有时间都换算成这个时区显示（IANA 名字）。
# 各来源自己声明它用的是哪个时区（见 data/profiles/*.toml 的 [profile].timezone），
# 导入时换算过来。写错名字会在读设置时就报错，不会拖到导入。
timezone = "Europe/London"

[currency]
# 所有金额都换算成这个币种显示与统计。
display = "GBP"

# 汇率：**1 单位 display 币种 = 多少该币种**。
# 下面这行读作「1 GBP = 8.9 CNY」，也就是 GBP/CNY 的报价，
# 也就是人民币金额除以 8.9 得到英镑金额（¥890 -> £100）。
#
# 想调汇率就改这个数。没在这里列出、也不等于 display 的币种**不会被合并**，
# 它们仍按原币种单独成组显示——按 1:1 混进来会得到一个不报错的错数。
rates = { CNY = 8.9 }

[merge]
# AA / 拼单：一笔支出 + 之后跟着来的若干笔等额转入，合并成一行按净额算。
# 原始记录一个字都不改，合并只是「看的时候」的事，随时能取消。
enabled = true

# 收款落在支出之后多久算同一次。朋友还钱一般在当天，12 小时够了；
# 放宽会让本不相干的两笔凑到一起。
window_hours = 12

# 每笔收款与「人均份额」允许差多少（显示币种）。£120 三个人分，每人 £40，
# 朋友转了 £40.30 也算数。
tolerance = 0.5

# 转入要像「别人还你钱」才参与自动合并：对方、说明、账单分类里命中下面的
# 任一个词即可。这道过滤挡的是**形状巧合**——薪水入账 £3000 和一笔 £6000
# 的消费正好构成「两人 AA」的形状，纯按数学判就会误合，而误合会安静地把
# 统计改错。漏掉的下场轻得多：手动勾两下就合上了。
#
# 留空 = 关掉这道过滤，只按数学判。
keywords = ["转账", "红包", "收款", "还款", "代付", "AA", "拼单", "分账", "transfer", "repay", "split"]
