# 默认设置。要改的话，要么在「设置」页上改（会写到你自己的配置目录里），要么
# 在自己配置目录里放一份同名文件整体覆盖它：
#
#     ~/.local/share/bill/settings.toml
#
# 改完刷新页面就生效，不用重启——应用每次请求都会重新读这个文件。

[ui]
# 界面配色：dark（深色）、light（浅色）、dark-teal（深色 · 青橙）、
# light-teal（浅色 · 青橙）。每套的收入 / 支出色都跑过色盲校验，
# 取值都在 src/bill/themes.py 里。
theme = "dark"

# 所有时间都换算成这个时区显示（IANA 名字）。
# 各来源自己声明它用的是哪个时区（见 data/profiles/*.toml 的 [profile].timezone），
# 导入时换算过来。写错名字会在读设置时就报错，不会拖到导入。
timezone = "Europe/London"

[currency]
# 所有金额都换算成这个币种显示与统计。
display = "GBP"

# 汇率：**1 单位 display 币种 = 多少该币种**。
# 下面这行读作「1 GBP = 8.9 CNY」，也就是 GBP/CNY 的报价，
# 也就是人民币金额除以 8.9 得到英镑金额（¥890 -> £100）。
#
# 想调汇率就改这个数。没在这里列出、也不等于 display 的币种**不会被合并**，
# 它们仍按原币种单独成组显示——按 1:1 混进来会得到一个不报错的错数。
rates = { CNY = 8.9 }

[large]
# 单笔到什么数就算「大额」，不进收入/支出合计（汇总页底部会单独列出来）。
# 单位是**上面那个 display 币种的主单位**，也就是「500」在 GBP 账本下是 £500。
# 0 表示这一侧不启用。
#
# ⚠️ 阈值跟着 display 走，不是固定的人民币或英镑。把 display 改成 "CNY" 之后，
#    这两个数就变成 ¥500 / ¥2,000——而 ¥2,000 只相当于约 £225，**一笔正常工资
#    都会被当成大额剔掉**。人民币账本下收入和支出这两个数多半都要往上调不少，
#    比如 out = 3000、in = 50000，按自己的工资水平定。
#
# 只对换算得到 display 的币种生效。没配汇率的币种比不了（拿英镑的阈值去比
# 人民币的数没有意义），所以那些币种里一笔都不会被判成大额。
#
# 对不上账时先看这里：汇总页和首页都会写明当前生效的阈值，
# 以及各自剔掉了几笔、合计多少。
out = 500
in = 2000

[merge]
# 合并：一笔支出 + 之后跟着来的收款，合并成一行按净额算。原始记录一个字都不改，
# 合并只是「看的时候」的事，随时能取消。两种形状：
#
#   AA / 拼单   —— 之后跟着几笔等额转入，净额是你自己那一份（几个人各摊一份）；
#   收支平衡    —— 之后跟着一笔等额收入，净额是 0（退款、转出去又转回来）。
#
# 下面这个开关关掉的是后者，前者照常。
enabled = true
balanced = true

# 收款落在支出之后多久算同一次。朋友还钱一般在当天，12 小时够了；
# 放宽会让本不相干的两笔凑到一起。
window_hours = 12

# 每笔收款与「人均份额」允许差多少（显示币种）。£120 三个人分，每人 £40，
# 朋友转了 £40.30 也算数。
tolerance = 0.5

# 转入要像「别人还你钱」才参与自动合并：对方、说明、账单分类里命中下面的
# 任一个词即可。这道过滤挡的是**形状巧合**——薪水入账 £3000 和一笔 £6000
# 的消费正好构成「两人 AA」的形状，纯按数学判就会误合，而误合会安静地把
# 统计改错。漏掉的下场轻得多：手动勾两下就合上了。
#
# 留空 = 关掉这道过滤，只按数学判。
keywords = ["转账", "红包", "收款", "还款", "代付", "AA", "拼单", "分账", "transfer", "repay", "split"]

[imports]
# 一个账户超过这么多天没导入账单，首页就提醒。0 = 不提醒
# （账户区仍会显示每个账户上次导入的时间）。
stale_days = 30
