{# 所有页面共用的外壳。 #}
<!doctype html>
<html lang="zh-CN" data-theme="{{ palette.name }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}记账{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('summary') }}">记账</a>
    <nav>
      <a href="{{ url_for('summary') }}">汇总</a>
      <a href="{{ url_for('transactions') }}">交易记录</a>
      <a href="{{ url_for('import_upload') }}">导入账单</a>
      <a href="{{ url_for('settings_page') }}">设置</a>
      {% if auth_enabled %}
        {# 用表单 POST 而不是链接：登出改的是状态，不该被一张图、一个
           预取就顺手触发掉。 #}
        <form method="post" action="{{ url_for('logout') }}">
          <button class="link-button" type="submit">退出</button>
        </form>
      {% endif %}
    </nav>
  </header>

  {% if not auth_enabled %}
    <p class="notice warn-text">
      还没设密码：能访问到这台机器这个端口的人都能看到全部账目。
      跑 <code>bill --set-password</code> 设一个。
    </p>
  {% endif %}

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
