{# Shared shell for every page. #}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}bill{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">bill</a>
    <nav>
      <a href="{{ url_for('index') }}">Home</a>
      <a href="{{ url_for('notes') }}">Notes</a>
      <a href="{{ url_for('about') }}">About</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>Flask on port 8001</span>
    <span class="dot">·</span>
    <a href="{{ url_for('api_list_notes') }}">/api/notes</a>
    <span class="dot">·</span>
    <a href="{{ url_for('healthz') }}">/healthz</a>
  </footer>
</body>
</html>
