[project]
name = "bill"
version = "0.1.0"
description = "本地记账：导入支付宝 / 微信 / 银行账单，记录收支"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "openpyxl>=3.1.5",
]

[project.scripts]
bill = "bill:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "real: 需要 tests/fixtures/real 下的真实账单样本（默认跳过）",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
